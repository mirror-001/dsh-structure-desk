name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: unit tests
        # 默认隔离（每个测试文件一个子进程，原始行为）；--test-isolation 这个
        # 名字只有 Node 24 认，Node 22 会报 bad option，故 CI 不用它。
        run: npm test
